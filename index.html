<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
  <!-- 글꼴: ad-insight 와 같은 Pretendard (가변 · 필요한 글자만 받음) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <title>__TITLE__</title>
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
    window.__DATA__ = "__DATA__";
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
